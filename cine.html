<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Votos del Canal — Cine en Vivo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<meta name="description" content="Reacciona con nosotros. Mirá aquí la pantalla compartida y chatea en el stream oficial.">
<style>
  :root {
    --bg: #030712;
    --bg2: #0f172a;
    --sidebar: #0b1120;
    --line: rgba(255, 255, 255, 0.08);
    --pri: #10b981;
    --ink: #f8fafc;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100vh; height: 100dvh; overflow: hidden;
    color: var(--ink); font-family: Inter, system-ui, sans-serif;
    background: var(--bg); display: flex; flex-direction: column;
  }
  /* Layout principal */
  .layout { display: flex; flex: 1; min-height: 0; }
  .main-col { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; min-width: 0; }
  .chat-col { width: 350px; background: var(--sidebar); border-left: 1px solid var(--line); display: flex; flex-direction: column; box-shadow: -4px 0 20px rgba(0,0,0,0.5); z-index: 5; }

  /* Reproductor */
  .player-wrap { flex: 1; position: relative; width: 100%; height: 100%; background: #000; }
  .player-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
  .no-stream { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #1e293b, #020617); padding: 20px; text-align: center; }
  .no-stream h2 { font-family: "Bebas Neue"; font-size: 48px; color: #fff; margin: 0; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); font-weight: 400; }
  .no-stream p { color: var(--muted); margin-top: 8px; font-size: 15px; }

  /* Header superior sobre el video (el contenedor deja pasar los clics al player) */
  .stream-cover-top {
    position: absolute; top: 0; left: 0; width: 100%; height: 70px;
    background: linear-gradient(180deg, rgba(0,0,0,1) 30%, rgba(0,0,0,0.8) 70%, rgba(0,0,0,0));
    z-index: 25; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    pointer-events: none;
  }
  .stream-cover-top > * { pointer-events: auto; }

  .btn-back {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
    background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.05); border-radius: 99px;
    color: #fff; text-decoration: none; font-weight: 600; font-size: 13px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn-back:hover { background: rgba(255,255,255,0.2); transform: translateX(-4px); }

  .stream-title {
    font-family: "Bebas Neue", sans-serif; font-size: 26px; letter-spacing: 1px;
    background: linear-gradient(to right, #10b981, #3b82f6);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    pointer-events: none;
  }

  .live-indicator {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 99px;
    color: #ef4444; font-weight: 700; font-size: 12px; letter-spacing: 1px;
  }
  .live-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 10px #ef4444; animation: blink 1.5s infinite; }
  @keyframes blink { 0%,100% {opacity:1} 50% {opacity:0.4} }

  /* Footer inferior (redes) */
  .footer {
    min-height: 60px; background: var(--bg2); border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; padding: 8px 20px;
    z-index: 30; position: relative;
  }
  .f-right { display: flex; gap: 12px; align-items: center; justify-content: flex-end; width: 100%; flex-wrap: wrap; }
  .sbtn {
    display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px;
    border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: #f8fafc; text-decoration: none; font-weight: 600; font-size: 13px;
    transition: all 0.2s;
  }
  .sbtn:hover { transform: translateY(-2px); filter: brightness(1.2); }
  .sbtn.kick { background: #53fc18; border-color: #53fc18; color: #000; box-shadow: 0 4px 15px rgba(83,252,24,0.2); }
  .sbtn.twitch { background: #9146FF; border-color: #9146FF; color: white; box-shadow: 0 4px 15px rgba(145,70,255,0.2); }
  .sbtn.yt { background: #ff0000; border-color: #ff4d4d; color: white; }
  .sbtn.patreon { background: #FF424D; border-color: #FF424D; color: white; }

  /* Chat: pestañas */
  .chat-header { display: flex; background: #020617; }
  .chat-tab {
    flex: 1; padding: 14px; text-align: center; font-weight: 700; font-size: 13px; letter-spacing: 1px;
    color: var(--muted); cursor: pointer; transition: all 0.2s; border: 0; border-bottom: 2px solid transparent;
    background: transparent; font-family: inherit;
  }
  .chat-tab:hover { color: #fff; background: rgba(255,255,255,0.02); }
  .chat-tab.active[data-target="chatKick"] { color: #53fc18; border-bottom: 2px solid #53fc18; background: rgba(83,252,24,0.05); }
  .chat-tab.active[data-target="chatTwitch"] { color: #9146FF; border-bottom: 2px solid #9146FF; background: rgba(145,70,255,0.05); }

  .chat-content { flex: 1; width: 100%; position: relative; min-height: 0; }
  .chat-wrap { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  .chat-wrap.active { display: block; }
  .chat-wrap iframe { width: 100%; height: 100%; border: none; }
  .chat-open { padding: 8px 12px; text-align: center; background: #020617; border-top: 1px solid var(--line); font-size: 12px; }
  .chat-open a { color: #53fc18; text-decoration: none; font-weight: 600; }
  .chat-open a:hover { text-decoration: underline; }
  .chat-open.hidden { display: none; }
  .chat-msg { padding: 20px; text-align: center; color: #a6b7e8; font-size: 14px; }

  /* Pantallas chicas: se permite scroll, el video mantiene 16:9 y el chat queda debajo */
  @media (max-width: 900px) {
    html, body { height: auto; min-height: 100dvh; overflow: auto; }
    .layout { flex-direction: column; flex: none; }
    .main-col { flex: none; }
    .player-wrap { flex: none; height: auto; aspect-ratio: 16 / 9; }
    .chat-col { width: 100%; height: 480px; border-left: none; border-top: 1px solid var(--line); box-shadow: none; }
    .f-right { justify-content: center; }
  }
  @media (max-width: 600px) {
    .stream-cover-top { height: 56px; padding: 0 10px; }
    .stream-title { display: none; }
    .btn-back { padding: 6px 12px; font-size: 12px; }
    .no-stream h2 { font-size: 30px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .live-dot { animation: none; }
  }
</style>
</head>
<body>
<div class="layout">
  <div class="main-col">
    <div class="player-wrap" id="playerWrap">

      <!-- HEADER CUSTOM -->
      <div class="stream-cover-top">
        <a href="./" class="btn-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Volver al Inicio
        </a>
        <div class="stream-title">CINE EN VIVO</div>
        <div class="live-indicator"><div class="live-dot"></div> DIRECTO</div>
      </div>

      <div id="playerFrameContainer" style="width:100%;height:100%;">
        <div class="no-stream">
          <h2>Cargando Transmisión...</h2>
          <p>Un momento, estamos buscando la escena.</p>
        </div>
      </div>
    </div>
  </div>
  <div class="chat-col">
    <div class="chat-header">
      <button type="button" class="chat-tab active" data-target="chatKick">KICK</button>
      <button type="button" class="chat-tab" data-target="chatTwitch">TWITCH</button>
    </div>
    <div class="chat-content">
      <div class="chat-wrap active" id="chatKick"></div>
      <div class="chat-wrap" id="chatTwitch"></div>
    </div>
    <div class="chat-open" id="kickOpen">
      <a id="kickOpenLink" href="https://kick.com/alecciss" target="_blank" rel="noopener">¿No ves el chat de Kick? Abrilo en una ventana ↗</a>
    </div>
  </div>
</div>

<div class="footer">
  <div class="f-right">
    <a class="sbtn kick" href="https://kick.com/alecciss" target="_blank" rel="noopener">KICK</a>
    <a class="sbtn twitch" href="https://twitch.tv/alecciss" target="_blank" rel="noopener">TWITCH</a>
    <a class="sbtn yt" href="https://youtube.com/@alecciss1" target="_blank" rel="noopener">YT Anime</a>
    <a class="sbtn yt" href="https://youtube.com/@alecciss2" target="_blank" rel="noopener">YT Cine</a>
    <a class="sbtn" href="https://discord.gg/7NVwCU7RA9" target="_blank" rel="noopener">Discord</a>
    <a class="sbtn patreon" href="https://www.patreon.com/Aleccis" target="_blank" rel="noopener">Patreon</a>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);

  function isHttps(u) {
    try { return new URL(u).protocol === 'https:'; } catch (e) { return false; }
  }

  function showStreamMsg(title, text) {
    const box = $('playerFrameContainer');
    box.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'no-stream';
    const h = document.createElement('h2'); h.textContent = title;
    const p = document.createElement('p'); p.textContent = text;
    d.append(h, p);
    box.appendChild(d);
  }

  function showChatMsg(id, text) {
    const el = $(id);
    el.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'chat-msg';
    d.textContent = text;
    el.appendChild(d);
  }

  function mountIframe(container, src, attrs) {
    container.innerHTML = '';
    const f = document.createElement('iframe');
    f.src = src;
    Object.entries(attrs || {}).forEach(([k, v]) => f.setAttribute(k, v));
    container.appendChild(f);
  }

  // El chat de Kick solo se puede embeber con la URL "popout".
  // Si la config trae /chatroom (o nada), se arma sola a partir del canal.
  function kickChannelOf(j) {
    let ch = j.kickChannel || '';
    if (!ch) {
      const m = (j.chatUrl || '').match(/kick\.com\/(?:popout\/)?([^\/?#]+)/i);
      if (m) ch = m[1];
    }
    return ch;
  }

  function kickChatUrl(j) {
    const ch = kickChannelOf(j);
    const u = j.chatUrl || '';
    if (ch && (!u || /\/chatroom\/?$/i.test(u))) {
      return 'https://kick.com/popout/' + encodeURIComponent(ch) + '/chat';
    }
    return u;
  }

  function loadConfig() {
    return fetch('./cine.json?t=' + Date.now()).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  loadConfig().then(j => {
    // Reproductor
    if (j.streamUrl && isHttps(j.streamUrl)) {
      mountIframe($('playerFrameContainer'), j.streamUrl, { allowfullscreen: '', allow: 'autoplay; fullscreen' });
    } else {
      showStreamMsg('Sin Transmisión Activa', 'El administrador todavía no envió ninguna escena del cine.');
    }

    // Chat de Kick
    const kickCh = kickChannelOf(j);
    if (kickCh) {
      $('kickOpenLink').href = 'https://kick.com/popout/' + encodeURIComponent(kickCh) + '/chat';
    }
    const kickUrl = kickChatUrl(j);
    if (kickUrl && isHttps(kickUrl)) {
      mountIframe($('chatKick'), kickUrl);
    } else {
      showChatMsg('chatKick', 'Chat de Kick no configurado.');
    }

    // Chat de Twitch: el "parent" tiene que ser el dominio donde está publicada la página.
    // Se usa el dominio actual automáticamente (y el de la config, si existe).
    if (j.twitchChannel) {
      const parents = [...new Set([location.hostname, j.twitchParent].filter(Boolean))];
      if (parents.length) {
        const qs = parents.map(p => 'parent=' + encodeURIComponent(p)).join('&');
        mountIframe($('chatTwitch'),
          'https://www.twitch.tv/embed/' + encodeURIComponent(j.twitchChannel) + '/chat?darkpopout&' + qs);
      } else {
        showChatMsg('chatTwitch', 'Twitch necesita un dominio (parent). Abrí la página desde su dirección publicada.');
      }
    } else {
      showChatMsg('chatTwitch', 'Chat de Twitch no configurado.');
    }
  }).catch(e => {
    console.error('Error cargando cine.json:', e);
    showStreamMsg('Error de conexión', 'No se pudo cargar la info del stream.');
    showChatMsg('chatKick', 'No se pudo cargar el chat.');
    showChatMsg('chatTwitch', 'No se pudo cargar el chat.');
  });

  // Pestañas del chat
  document.querySelectorAll('.chat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.chat-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.chat-wrap').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      $(tab.getAttribute('data-target')).classList.add('active');
      $('kickOpen').classList.toggle('hidden', tab.getAttribute('data-target') !== 'chatKick');
    });
  });
</script>
</body>
</html>
