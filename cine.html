<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Votos del Canal — Cine en Vivo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<meta name="description" content="Reacciona con nosotros. Mirá aquí la pantalla compartida y chatea en el stream oficial.">
<style>
  :root {
    --bg: #030712; 
    --bg2: #0f172a; 
    --sidebar: #0b1120;
    --line: rgba(255, 255, 255, 0.08); 
    --pri: #10b981; 
    --ink: #f8fafc; 
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100vh; overflow: hidden;
    color: var(--ink); font-family: Inter, system-ui, sans-serif;
    background: var(--bg); display: flex; flex-direction: column;
  }
  /* Layout principal */
  .layout { display: flex; flex: 1; height: calc(100vh - 60px); }
  .main-col { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
  .chat-col { width: 350px; background: var(--sidebar); border-left: 1px solid var(--line); display: flex; flex-direction: column; box-shadow: -4px 0 20px rgba(0,0,0,0.5); position: relative; z-index: 40; isolation: isolate; }
  
  /* ALECCISS_CINE_CHAT_TOGGLE_V1: comportamiento de ocultar/mostrar chats */
  .layout, .main-col { min-width: 0; min-height: 0; }
  body.chat-hidden .chat-col { display: none !important; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  /* ALECCISS_CINE_MEUSONLINE_V1: contador propio con datos reales del proveedor. */
  .cine-viewers-widget {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    flex: 0 0 76px;
    width: 76px;
    height: 33px;
    margin: 0;
    padding: 0 8px;
    border: 1px solid rgba(148,163,184,.26);
    border-radius: 999px;
    background: rgba(15,23,42,.95);
    box-shadow: 0 2px 10px rgba(0,0,0,.22);
    color: #f8fafc;
    font: 700 14px/1 Inter,system-ui,sans-serif;
    white-space: nowrap;
    user-select: none;
  }
  .cine-viewers-icon { font-size: 14px; line-height: 1; }
  .cine-viewers-count { font: inherit; font-variant-numeric: tabular-nums; }
  .footer .cine-viewers-widget { position: static; z-index: auto; justify-self: center; }
  .chat-toggle-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 36px; padding: 8px 13px; border-radius: 9px;
    border: 1px solid rgba(16,185,129,.55);
    background: rgba(3,18,13,.88); color: #c8ffe9;
    font: 700 12px/1.2 Inter,system-ui,sans-serif;
    cursor: pointer; white-space: nowrap;
    transition: background .2s, color .2s;
  }
  .chat-toggle-btn:hover { background: rgba(16,185,129,.25); color: #fff; }
  .chat-toggle-btn:focus-visible { outline: 2px solid #6ee7b7; outline-offset: 3px; }
  @media (max-width: 600px) {
    .stream-cover-top { gap: 8px; padding: 0 10px; }
    .stream-title, .live-indicator { display: none; }
    .btn-back { padding: 8px 11px; }
    .chat-toggle-btn { padding: 8px 10px; }
  }

  /* Reproductor */
  .player-wrap { flex: 1; position: relative; width: 100%; height: 100%; background: #000; }
  .player-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
  .no-stream { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #1e293b, #020617); padding: 20px; text-align: center; }
  .no-stream h2 { font-family: "Bebas Neue"; font-size: 48px; color: #fff; margin: 0; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  .no-stream p { color: var(--muted); margin-top: 8px; font-size: 15px; }

  /* OVERLAYS PARA OCULTAR KICK Y DAR ESTILO PREMIUM */
  .stream-cover-top {
    position: absolute; top: 0; left: 0; width: 100%; height: 70px;
    background: linear-gradient(180deg, rgba(0,0,0,1) 30%, rgba(0,0,0,0.8) 70%, rgba(0,0,0,0));
    z-index: 25; display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    pointer-events: none;
  }
  /* Los botones del encabezado siguen siendo interactivos */
  .stream-cover-top a, .stream-cover-top button { pointer-events: auto; }
  /* Bloquear marca de agua de Kick invisible */
  .stream-cover-watermark {
    position: absolute; bottom: 44px; right: 10px; width: 200px; height: 42px;
    background: transparent; z-index: 25; pointer-events: none;
  }
  @media (max-width: 600px) {
    .stream-cover-watermark { bottom: 35px; width: 140px; height: 35px; right: 5px; }
  }
  
  /* Elementos del Header Superior */
  .btn-back {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
    background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.05); border-radius: 99px;
    color: #fff; text-decoration: none; font-weight: 600; font-size: 13px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn-back:hover { background: rgba(255,255,255,0.2); transform: translateX(-4px); }
  
  .stream-title {
    font-family: "Bebas Neue", sans-serif; font-size: 26px; letter-spacing: 1px;
    background: linear-gradient(to right, #10b981, #3b82f6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 2px 10px rgba(16,185,129,0.2);
  }
  
  .live-indicator {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 99px;
    color: #ef4444; font-weight: 700; font-size: 12px; letter-spacing: 1px;
  }
  .live-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 10px #ef4444; animation: blink 1.5s infinite; }
  @keyframes blink { 0%,100% {opacity:1} 50% {opacity:0.4} }

  /* Footer inferior (Controles y Redes) */
  .footer { 
    height: 60px; background: var(--bg2); border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    z-index: 30; position: relative;
  }
  
  .f-right { display: flex; gap: 10px; align-items: center; justify-content: center; width: auto; min-width: 0; }
  /* ALECCISS_CINE_CONTADOR_PIE_V4: contador primero, junto a las redes. */
  .footer { justify-content: center; flex: 0 0 60px; min-height: 60px; }
  .footer .f-right { width: auto; max-width: 100%; justify-content: center; flex-wrap: nowrap; gap: 9px; }
  .footer .cine-viewers-widget { order: -1; flex-shrink: 0; }
  @media (min-width: 901px) and (max-width: 1199px) {
    .footer .f-right { gap: 6px; }
    .footer .sbtn { padding: 8px 10px; font-size: 12px; }
  }
  /* En celular, una sola franja visible: contador fijo a la izquierda;
     las redes pueden desplazarse horizontalmente sin tapar video/chat. */
  @media (max-width: 900px) {
    .footer { height: 60px; min-height: 60px; flex: 0 0 60px; padding: 0 9px; flex-wrap: nowrap; }
    .footer .f-right {
      width: 100%; max-width: 100%; min-width: 0;
      justify-content: flex-start; flex-wrap: nowrap; gap: 8px;
      overflow-x: auto; overflow-y: hidden; white-space: nowrap;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }
    .footer .f-right::-webkit-scrollbar { display: none; }
    .footer .cine-viewers-widget {
      position: sticky; left: 0; z-index: 2;
      flex: 0 0 76px; width: 76px; height: 33px;
      background: #0f172a;
    }
    .footer .sbtn { flex: 0 0 auto; font-size: 11px; padding: 8px 10px; }
  }
  .sbtn {
    display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px;
    border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: #f8fafc; text-decoration: none; font-weight: 600; font-size: 13px;
    transition: all 0.2s;
  }
  .sbtn:hover { transform: translateY(-2px); filter: brightness(1.2); }
  .sbtn.kick { background: #53fc18; border-color: #53fc18; color: #000; box-shadow: 0 4px 15px rgba(83,252,24,0.2); }
  .sbtn.twitch { background: #9146FF; border-color: #9146FF; color: white; box-shadow: 0 4px 15px rgba(145,70,255,0.2); }
  .sbtn.yt { background: #ff0000; border-color: #ff4d4d; color: white; }
  .sbtn.patreon { background: #FF424D; border-color: #FF424D; color: white; }
  
  /* Chat Iframe & Tabs */
  .chat-header { display: flex; background: #020617; }
  .chat-tab {
    flex: 1; padding: 14px; text-align: center; font-weight: 700; font-size: 13px; letter-spacing: 1px;
    color: var(--muted); cursor: pointer; transition: all 0.2s; border-bottom: 2px solid transparent;
  }
  .chat-tab:hover { color: #fff; background: rgba(255,255,255,0.02); }
  .chat-tab.active[data-target="chatKick"] { color: #53fc18; border-bottom: 2px solid #53fc18; background: rgba(83,252,24,0.05); }
  .chat-tab.active[data-target="chatTwitch"] { color: #9146FF; border-bottom: 2px solid #9146FF; background: rgba(145,70,255,0.05); }
  
  .chat-content { flex: 1; width: 100%; position: relative; }
  .chat-wrap { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  .chat-wrap.active { display: block; }
  .chat-wrap iframe { width: 100%; height: 100%; border: none; }
  @media (max-width: 900px) {
    html, body { height: 100vh; }
    @supports (height: 100dvh) { html, body { height: 100dvh; } }
    .layout { flex-direction: column; height: auto; flex: 1 1 auto; min-height: 0; }
    .main-col { min-height: 0; }
    .chat-col { width: 100%; height: 400px; min-height: 0; border-left: none; border-top: 1px solid var(--line); }
    .f-right { flex-wrap: wrap; justify-content: center; }
  }

  /* ========== WIDGET DE VOTACIÓN FLOTANTE ========== */
  #vote-widget {
    position: fixed;
    bottom: 80px;
    left: 20px;
    z-index: 100;
    width: 310px;
    background: rgba(3, 7, 18, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(16, 185, 129, 0.35);
    border-radius: 18px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04) inset;
    padding: 16px;
    transform: translateY(20px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s cubic-bezier(0.4,0,0.2,1), transform 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  #vote-widget.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .vw-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .vw-pulse {
    width: 8px; height: 8px;
    background: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 8px #10b981;
    animation: blink 1.5s infinite;
    flex-shrink: 0;
  }
  .vw-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #10b981;
  }
  .vw-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: #fff;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
    line-height: 1.2;
    min-height: 24px;
  }
  /* Paso 1: nombre */
  #vw-step-name { display: block; }
  #vw-step-name label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  #vw-name-input {
    width: 100%;
    padding: 9px 12px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    font-family: Inter, sans-serif;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 10px;
  }
  #vw-name-input:focus { border-color: #10b981; }
  #vw-name-input::placeholder { color: #64748b; }
  #vw-btn-continue {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, #10b981, #059669);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.15s, filter 0.15s;
  }
  #vw-btn-continue:hover { transform: translateY(-1px); filter: brightness(1.1); }
  /* Paso 2: botones de puntaje */
  #vw-step-vote { display: none; }
  #vw-step-vote .vw-who {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  #vw-step-vote .vw-who span { color: #fff; font-weight: 700; }
  .vw-scores {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }
  .vw-score-btn {
    aspect-ratio: 1;
    border: 2px solid transparent;
    border-radius: 10px;
    color: #fff;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    position: relative;
    overflow: hidden;
  }
  .vw-score-btn:hover { transform: scale(1.12); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
  .vw-score-btn.selected {
    border-color: #fff;
    transform: scale(1.12);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.25);
  }
  .vw-manual-label { margin-top: 12px; font-size: 12px; font-weight: 600; color: #cbd5e1; }
  .vw-manual-form { display: flex; gap: 8px; margin-top: 7px; }
  .vw-manual-input {
    width: 0; min-width: 0; flex: 1; border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08); color: #fff; border-radius: 9px;
    padding: 10px 12px; font: 700 15px Inter, system-ui, sans-serif;
    outline: none;
  }
  .vw-manual-input:focus { border-color: #10b981; }
  .vw-manual-input::placeholder { color: #94a3b8; font-weight: 400; }
  .vw-manual-submit {
    border: 0; border-radius: 9px; padding: 9px 12px;
    background: #10b981; color: #03120b; font-weight: 800; cursor: pointer;
  }
  .vw-manual-submit:disabled { opacity: .55; cursor: wait; }
  .vw-manual-error { min-height: 16px; margin-top: 5px; font-size: 11px; color: #fca5a5; }
  /* Paso 3: confirmación */
  #vw-step-confirm { display: none; text-align: center; }
  .vw-check {
    font-size: 40px;
    margin-bottom: 6px;
    animation: popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .vw-confirm-score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    line-height: 1;
    color: #fff;
    margin-bottom: 2px;
  }
  .vw-confirm-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  #vw-btn-change {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    color: #94a3b8;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 16px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  #vw-btn-change:hover { background: rgba(255,255,255,0.14); color: #fff; }

  /* ALECCISS_TWITCH_PC_V2_LOW: Twitch en PC, visible y sin alterar la vista movil */
  .twitch-desktop-panel { display: none; background: #0b1120; border-bottom: 1px solid var(--line, rgba(255,255,255,.1)); }
  .twitch-desktop-panel[hidden] { display: none !important; }
  .twitch-desktop-heading {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; min-height: 36px; background: #161126;
    color: #dac9ff; font: 700 12px/1.2 Inter,system-ui,sans-serif; letter-spacing: .6px;
  }
  .twitch-desktop-link { color: #dac9ff; text-decoration: none; font-weight: 600; letter-spacing: 0; }
  .twitch-desktop-link:hover { text-decoration: underline; }
  .twitch-desktop-mount, .twitch-desktop-mount iframe {
    display: block; width: 100%; height: 300px; border: 0; background: #000;
  }
  @media (min-width: 1100px) and (min-height: 640px) {
    body.twitch-desktop-ready .chat-col { width: 424px; flex: 0 0 424px; }
    .twitch-desktop-panel:not([hidden]) { display: block; }
  }


  /* ALECCISS_CINE_CHAT_LAYOUT_V3: escritorio compacto; movemos las pestañas a la barra azul del pie. */
  @media (min-width: 1100px) and (min-height: 640px) {
    body:not(.chat-hidden) .chat-col { min-height: 0; }
    body:not(.chat-hidden) .chat-content { min-height: 0; flex: 1 1 auto; }
    body:not(.chat-hidden) .twitch-desktop-panel { flex: 0 0 auto; }
    body:not(.chat-hidden) .chat-header {
      position: fixed; bottom: 0; right: 0; width: 294px;
      height: 60px; z-index: 35;
      box-sizing: border-box; display: flex; align-items: center; gap: 8px;
      padding: 0 12px; border: 0;
      background: #0f172a;
    }
    body:not(.chat-hidden) .chat-header .chat-tab {
      flex: 1 1 0; min-width: 0; min-height: 36px;
      padding: 9px 8px; border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px; background: #111d34;
      font: 700 12px/16px Inter, system-ui, sans-serif;
      letter-spacing: .4px; color: #cbd5e1;
    }
    body:not(.chat-hidden) .chat-header .chat-tab.active[data-target="chatKick"] {
      border: 1px solid #53fc18; background: rgba(83,252,24,.13); color: #79ff56;
    }
    body:not(.chat-hidden) .chat-header .chat-tab.active[data-target="chatTwitch"] {
      border: 1px solid #9146ff; background: rgba(145,70,255,.16); color: #c3a5ff;
    }
    body:not(.chat-hidden) .footer {
      padding-left: 16px; padding-right: 310px;
      justify-content: center;
    }
    body:not(.chat-hidden) .footer .f-right {
      max-width: 100%; min-width: 0; width: auto;
      justify-content: center; gap: 8px;
      overflow-x: auto; overflow-y: hidden; white-space: nowrap;
      scrollbar-width: none;
    }
    body:not(.chat-hidden) .footer .f-right::-webkit-scrollbar { display: none; }
  }


  /* ALECCISS_FOOTER_TABS_V6: Tabs de chat dentro de la barra inferior en PC. */
  @media (min-width: 1100px) {
    body:not(.chat-hidden) .footer { padding-right: 310px !important; }
    .footer > .chat-header {
      position: absolute !important;
      left: auto !important;
      bottom: 0 !important;
      right: 0 !important;
      width: 294px !important;
      height: 60px !important;
      z-index: 35 !important;
      background: #0f172a !important;
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      padding: 0 12px !important;
      box-sizing: border-box !important;
      border: 0 !important;
    }
    body.chat-hidden .footer > .chat-header { display: none !important; }
    .footer > .chat-header .chat-tab {
      min-width: 0; min-height: 36px;
      flex: 1 1 0;
      padding: 9px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.13);
      background: #111d34;
      font: 700 12px/16px Inter,system-ui,sans-serif;
      letter-spacing: .4px;
      text-align: center;
      cursor: pointer;
    }
  }


  /* ALECCISS_TWITCH_LAYOUT_V7: Twitch siempre encima del chat en escritorio; tabs en la barra azul. */
  @media (min-width: 1100px) {
    body.twitch-desktop-ready:not(.chat-hidden) #chatSidebar {
      display: flex !important;
      flex-direction: column !important;
      min-height: 0 !important;
      width: 424px !important;
      flex: 0 0 424px !important;
    }
    body.twitch-desktop-ready:not(.chat-hidden) #twitchDesktopPanel:not([hidden]) {
      display: block !important;
      flex: 0 0 300px !important;
      height: 300px !important;
      min-height: 300px !important;
      overflow: hidden !important;
    }
    #twitchDesktopMount,
    #twitchDesktopMount iframe {
      display: block;
      width: 100% !important;
      height: 300px !important;
      border: 0;
      background: #000;
    }
    body:not(.chat-hidden) #chatSidebar .chat-content {
      min-height: 0 !important;
      flex: 1 1 auto !important;
    }
    body:not(.chat-hidden) .footer {
      padding-left: 12px !important;
      padding-right: 424px !important;
    }
    body:not(.chat-hidden) .footer > .chat-header {
      position: absolute !important;
      display: flex !important;
      justify-content: stretch !important;
      align-items: center !important;
      left: auto !important;
      top: auto !important;
      bottom: 0 !important;
      right: 0 !important;
      width: 424px !important;
      height: 60px !important;
      padding: 7px 12px !important;
      gap: 10px !important;
      margin: 0 !important;
      border: 0 !important;
      box-sizing: border-box !important;
      background: #0f172a !important;
      z-index: 35 !important;
    }
    body:not(.chat-hidden) .footer > .chat-header .chat-tab {
      flex: 1 1 0 !important;
      min-width: 0 !important;
      text-align: center !important;
    }
    body.chat-hidden .footer > .chat-header { display: none !important; }
  }

</style>
</head>
<body>
<div class="layout">
  <div class="main-col">
    <div class="player-wrap" id="playerWrap">

    <button id="vw-btn-change">Cambiar mi voto</button>
  </div>
</div>
<!-- /WIDGET DE VOTACIÓN -->

<script>
  // El sitio está en GitHub Pages, pero la API debe ser un servidor HTTPS público.
  // localhost se permite únicamente para probar el preview local.
  const configuredApiUrl = "https://proteins-experienced-match-baths.trycloudflare.com";
  const LIVE_API = configuredApiUrl || ((location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? location.origin : '');

  // ============ WIDGET DE VOTACIÓN ============
  (function() {
    const widget      = document.getElementById('vote-widget');
    const stepName    = document.getElementById('vw-step-name');
    const stepVote    = document.getElementById('vw-step-vote');
    const stepConfirm = document.getElementById('vw-step-confirm');
    const nameInput   = document.getElementById('vw-name-input');
    const btnContinue = document.getElementById('vw-btn-continue');
    const whoName     = document.getElementById('vw-who-name');
    const scoresGrid  = document.getElementById('vw-scores');
    const confirmScore= document.getElementById('vw-confirm-score');
    const btnChange   = document.getElementById('vw-btn-change');
    const epTitle     = document.getElementById('vw-episode-title');
    const manualForm  = document.getElementById('vw-manual-form');
    const manualInput = document.getElementById('vw-manual-input');
    const manualSubmit = document.getElementById('vw-manual-submit');
    const manualError = document.getElementById('vw-manual-error');
    let sendingVote = false;

    // Generar o recuperar sessionId único por sesión del navegador
    let sessionId = sessionStorage.getItem('vw_session');
    if (!sessionId) {
      sessionId = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
      sessionStorage.setItem('vw_session', sessionId);
    }

    // Recuperar apodo guardado
    const savedName = localStorage.getItem('vw_username') || '';
    if (savedName) nameInput.value = savedName;

    let currentVote = null; // puntaje actual enviado
    let username    = savedName;

    // Colores por rango de puntaje
    function scoreColor(n) {
      if (n >= 9) return '#0f6d2f';
      if (n >= 8) return '#22c55e';
      if (n >= 7) return '#facc15';
      if (n >= 6) return '#fb923c';
      if (n >= 4) return '#ef4444';
      return '#1e293b';
    }

    // Construir los 10 botones de puntaje
    function buildScoreButtons() {
      scoresGrid.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.className = 'vw-score-btn';
        btn.textContent = i;
        btn.style.background = scoreColor(i);
        btn.setAttribute('aria-label', 'Votar ' + i + ' de 10');
        btn.addEventListener('click', () => sendVote(i, btn));
        scoresGrid.appendChild(btn);
      }
    }
    buildScoreButtons();

    // Los botones conservan su comportamiento. El campo manual acepta punto
    // o coma, con un decimal, de 1 a 10. No redondear votos silenciosamente.
    manualForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const raw = manualInput.value.trim();
      if (!/^(?:10(?:[.,]0)?|[1-9](?:[.,][0-9])?)$/.test(raw)) {
        manualError.textContent = 'Ingresá un número del 1 al 10 con hasta un decimal (ej.: 8.5).';
        manualInput.focus();
        return;
      }
      manualError.textContent = '';
      sendVote(Number(raw.replace(',', '.')));
    });
    manualInput.addEventListener('input', () => { manualError.textContent = ''; });

    // Enviar voto al servidor; ambos métodos usan la misma sesión de usuario.
    async function sendVote(score, clickedBtn = null) {
      if (sendingVote) return;
      if (!LIVE_API) {
        manualError.textContent = 'La votación pública no está conectada al servidor.';
        return;
      }
      sendingVote = true;
      manualSubmit.disabled = true;
      const buttons = document.querySelectorAll('.vw-score-btn');
      buttons.forEach(b => { b.disabled = true; b.classList.remove('selected'); });
      if (clickedBtn) clickedBtn.classList.add('selected');
      manualError.textContent = '';
      try {
        const res = await fetch(LIVE_API + '/api/vote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ score, sessionId, username })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data.ok) {
          currentVote = score;
          showConfirm(score);
        } else if (data.reason === 'closed') {
          hideWidget();
          manualError.textContent = 'La votación ya se cerró.';
        } else {
          manualError.textContent = 'No se pudo registrar: ' + (data.reason || 'error del servidor');
        }
      } catch (err) {
        console.error('Error al votar:', err);
        manualError.textContent = 'Error de conexión. Probá nuevamente.';
      } finally {
        sendingVote = false;
        manualSubmit.disabled = false;
        buttons.forEach(b => { b.disabled = false; });
      }
    }

    function showStep(step) {
      stepName.style.display    = (step === 'name')    ? 'block' : 'none';
      stepVote.style.display    = (step === 'vote')    ? 'block' : 'none';
      stepConfirm.style.display = (step === 'confirm') ? 'block' : 'none';
    }

    function showConfirm(score) {
      confirmScore.textContent = score;
      confirmScore.style.color = scoreColor(score);
      showStep('confirm');
    }

    function showWidget(title) {
      if (title) epTitle.textContent = title;
      // Si ya tiene apodo guardado y ya había votado en esta votación, volvemos al paso de voto
      if (username) {
        whoName.textContent = username;
        showStep(currentVote !== null ? 'confirm' : 'vote');
        if (currentVote !== null) showConfirm(currentVote);
      } else {
        showStep('name');
      }
      widget.classList.add('visible');
    }

    function hideWidget() {
      widget.classList.remove('visible');
      currentVote = null;
      manualError.textContent = '';
      manualInput.value = '';
    }

    // Botón Continuar (paso de nombre)
    function handleContinue() {
      const name = nameInput.value.trim();
      if (!name) { nameInput.focus(); return; }
      username = name;
      localStorage.setItem('vw_username', username);
      whoName.textContent = username;
      showStep('vote');
    }
    btnContinue.addEventListener('click', handleContinue);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleContinue(); });

    // Botón Cambiar voto
    btnChange.addEventListener('click', () => {
      currentVote = null;
      manualInput.value = '';
      manualError.textContent = '';
      document.querySelectorAll('.vw-score-btn').forEach(b => b.classList.remove('selected'));
      showStep('vote');
      manualInput.focus();
    });

    // Estado de votación: consulta HTTPS independiente del hosting del sitio.
    // GitHub Pages no ofrece Socket.IO ni API: los datos vienen del servidor público.
    let wasOpen = false;
    let checkedOnce = false;
    let checking = false;
    let connectionWarningLogged = false;
    async function syncVotingState() {
      if (!LIVE_API) {
        hideWidget();
        wasOpen = false;
        return;
      }
      if (checking) return;
      checking = true;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 6500);
      try {
        const response = await fetch(LIVE_API + '/api/summary?t=' + Date.now(), {
          cache: 'no-store', signal: controller.signal
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const state = await response.json();
        if (typeof state.votingOpen !== 'boolean') throw new Error('Estado incorrecto');
        connectionWarningLogged = false;
        if (state.votingOpen) {
          if (!wasOpen || !widget.classList.contains('visible')) {
            currentVote = null;
            showWidget(state.title || 'Capítulo');
          } else if (state.title) {
            epTitle.textContent = state.title;
          }
        } else if (wasOpen || !checkedOnce) {
          hideWidget();
        }
        wasOpen = state.votingOpen;
        checkedOnce = true;
      } catch (error) {
        // Sin votación o con servidor apagado, no molestamos al espectador.
        // El widget se recupera automáticamente cuando el servidor vuelve.
        if (wasOpen || widget.classList.contains('visible')) hideWidget();
        wasOpen = false;
        if (!connectionWarningLogged) {
          console.warn('Votación no disponible (sin aviso visual):', error);
          connectionWarningLogged = true;
        }
      } finally {
        clearTimeout(timeout);
        checking = false;
      }
    }
    syncVotingState();
    setInterval(syncVotingState, 2000);

  })(); // fin IIFE widget

  // ALECCISS_CINE_CHAT_TOGGLE_V1: preferencia privada del espectador, guardada en su navegador.
  (function () {
    const btn = document.getElementById('chat-toggle-btn');
    const sidebar = document.getElementById('chatSidebar');
    if (!btn || !sidebar) return;
    const preferenceKey = 'alecciss_cine_chats_ocultos_v1';
    let chatsHidden = false;
    try { chatsHidden = localStorage.getItem(preferenceKey) === '1'; } catch (e) { /* almacenamiento no disponible */ }
    function updateChats() {
      document.body.classList.toggle('chat-hidden', chatsHidden);
      sidebar.setAttribute('aria-hidden', chatsHidden ? 'true' : 'false');
      btn.setAttribute('aria-expanded', chatsHidden ? 'false' : 'true');
      btn.setAttribute('aria-label', chatsHidden ? 'Mostrar chats' : 'Ocultar chats');
      btn.textContent = chatsHidden ? '💬 Mostrar chats' : '💬 Ocultar chats';
    }
    updateChats();
    btn.addEventListener('click', function () {
      chatsHidden = !chatsHidden;
      updateChats();
      try { localStorage.setItem(preferenceKey, chatsHidden ? '1' : '0'); } catch (e) { /* navegador privado */ }
    });
  })();

  // ============ CARGA DEL STREAM Y CHATS ============
  let originalStreamUrl = "";
  let twitchChatConfig = null;

  function mountVisibleTwitchChat() {
    const panel = document.getElementById('chatTwitch');
    const sidebar = document.getElementById('chatSidebar');
    if (!panel.classList.contains('active') || document.body.classList.contains('chat-hidden') || !sidebar) return;
    if (!twitchChatConfig) {
      panel.innerHTML = '<div style="padding:20px;text-align:center;color:#a6b7e8">Falta el canal de Twitch o el dominio Parent en la configuración.</div>';
      return;
    }
    if (panel.querySelector('iframe')) return;
    const frame = document.createElement('iframe');
    frame.title = 'Chat de Twitch en vivo';
    frame.src = 'https://www.twitch.tv/embed/' + encodeURIComponent(twitchChatConfig.channel) +
      '/chat?darkpopout&parent=' + encodeURIComponent(twitchChatConfig.parent);
    panel.replaceChildren(frame);
  }

  fetch('./cine.json?t=' + Date.now()).then(r=>r.json()).then(j => {
    if(j.streamUrl) {
      originalStreamUrl = j.streamUrl;
      renderPlayer(originalStreamUrl);
    } else {
      document.getElementById('playerFrameContainer').innerHTML = '<div class="no-stream"><h2>Sin Transmisión Activa</h2><p>El administrador todavía no envió ninguna escena del cine.</p></div>';
    }

    if(j.chatUrl) {
      const chatContainer = document.getElementById('chatKick');
      chatContainer.innerHTML = '';
      const chatFrame = document.createElement('iframe');
      chatFrame.src = j.chatUrl;
      chatFrame.title = 'Chat de Kick en vivo';
      chatFrame.setAttribute('loading', 'lazy');
      chatContainer.appendChild(chatFrame);
    } else {
      document.getElementById('chatKick').innerHTML = '<div style="padding:20px;text-align:center;color:#a6b7e8">Chat de Kick no configurado.</div>';
    }

    // Twitch bloquea escritura de dueño/mods si su iframe se crea oculto.
    // Guardamos la configuración y montamos el chat solo en su pestaña visible.
    twitchChatConfig = (j.twitchChannel && j.twitchParent)
      ? { channel: j.twitchChannel, parent: j.twitchParent } : null;
    if (document.getElementById('chatTwitch').classList.contains('active')) {
      mountVisibleTwitchChat();
    }

    if(j.kickChannel) {
      document.getElementById('hiddenPlayer').innerHTML = `<iframe src="https://player.kick.com/${j.kickChannel}?muted=true&autoplay=true" allow="autoplay"></iframe>`;
    }
  }).catch(e => {
    document.getElementById('noStreamBox').innerHTML = '<h2>Error de conexión</h2><p>No se pudo cargar la info del stream.</p>';
  });

  function renderPlayer(url) {
    document.getElementById('playerFrameContainer').innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay; fullscreen"></iframe>`;
  }

  document.querySelectorAll('.chat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.getAttribute('data-target');
      // Desmontamos Twitch ANTES de esconder su pestaña: no queda un iframe
      // invisible que pueda activar las protecciones contra superposiciones.
      if (target !== 'chatTwitch') document.getElementById('chatTwitch').replaceChildren();
      document.querySelectorAll('.chat-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.chat-wrap').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(target).classList.add('active');
      if (target === 'chatTwitch') mountVisibleTwitchChat();
    });
  });
  // Al ocultar los chats, también descargamos Twitch; al mostrarlos, se monta
  // solo si su pestaña está activa y visible.
  document.getElementById('chat-toggle-btn').addEventListener('click', () => {
    const panel = document.getElementById('chatTwitch');
    if (document.body.classList.contains('chat-hidden')) panel.replaceChildren();
    else mountVisibleTwitchChat();
  });
</script>

<script>
/* ALECCISS_TWITCH_PC_V2_LOW: calidad minima Twitch y silencio solo PC. */
(function () {
  'use strict';
  var desktop = window.matchMedia('(min-width: 1100px)');
  var panel = document.getElementById('twitchDesktopPanel');
  var mount = document.getElementById('twitchDesktopMount');
  var link = document.getElementById('twitchDesktopLink');
  if (!panel || !mount) return;
  var channel = '';
  var desired = '160p'; // Configurable opcionalmente con twitchPlayerQuality en cine.json.
  var checkedConfig = false, loadingConfig = false;
  var sdkStatus = 'none', sdkWaiters = [];
  var generation = 0, mounting = false, player = null;

  function shouldShow() {
    return desktop.matches && !!channel && !document.body.classList.contains('chat-hidden');
  }
  function ensureSdk(callback) {
    if (window.Twitch && window.Twitch.Player) { callback(true); return; }
    if (sdkStatus === 'failed') { callback(false); return; }
    sdkWaiters.push(callback);
    if (sdkStatus === 'loading') return;
    sdkStatus = 'loading';
    var sdk = document.createElement('script');
    sdk.async = true;
    sdk.src = 'https://player.twitch.tv/js/embed/v1.js';
    function finish(ok) {
      sdkStatus = ok ? 'ready' : 'failed';
      var waiting = sdkWaiters.splice(0);
      waiting.forEach(function (fn) { fn(ok); });
    }
    sdk.onload = function () { finish(!!(window.Twitch && window.Twitch.Player)); };
    sdk.onerror = function () { finish(false); };
    document.head.appendChild(sdk);
  }
  function bestQuality(options) {
    if (!Array.isArray(options) || !options.length) return null;
    var qualities = options.filter(function (q) { return typeof q === 'string'; });
    // 160p por defecto; si no esta, 240p, luego 360p o la menor disponible.
    var order = desired === '240p' ? ['240p','160p','360p'] : ['160p','240p','360p'];
    for (var i=0; i<order.length; i++) {
      var match = qualities.find(function (q) { return q.toLowerCase().indexOf(order[i]) === 0; });
      if (match) return match;
    }
    var sorted = qualities.map(function (q) {
      var match = /^(\d+)p/i.exec(q);
      return { name:q, pixels:match ? Number(match[1]) : Infinity };
    }).filter(function (q) { return Number.isFinite(q.pixels); });
    sorted.sort(function (a,b) { return a.pixels - b.pixels; });
    return sorted.length ? sorted[0].name : null;
  }
  function lowQuality(p, id) {
    if (id !== generation || !shouldShow() || !p) return;
    try {
      var q = bestQuality(p.getQualities());
      if (q && p.getQuality() !== q) p.setQuality(q);
    } catch (e) { console.warn('Twitch calidad: no disponible aun', e); }
  }
  function createIframeFallback(id) {
    if (id !== generation || !shouldShow()) return;
    // Si falla la API, mantener Twitch visible y silenciado. Calidad no garantizada.
    var u = new URL('https://player.twitch.tv/');
    u.searchParams.set('channel', channel);
    u.searchParams.set('parent', location.hostname);
    u.searchParams.set('muted', 'true');
    u.searchParams.set('autoplay', 'true');
    var frame = document.createElement('iframe');
    frame.title = 'Twitch en directo - ' + channel;
    frame.src = u.href;
    frame.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
    frame.setAttribute('allowfullscreen', '');
    mount.replaceChildren(frame);
  }
  function sync() {
    var visible = shouldShow();
    panel.hidden = !visible;
    document.body.classList.toggle('twitch-desktop-ready', visible);
    if (!visible) {
      if (mount.firstChild || mounting || player) {
        generation++;
        if (player && typeof player.pause === 'function') { try { player.pause(); } catch (e) {} }
        player = null;
        mounting = false;
        mount.replaceChildren(); // libera iframe y evita consumir video en celular
      }
      return;
    }
    if (mount.firstChild || mounting) return;
    mounting = true;
    var id = ++generation;
    ensureSdk(function (ok) {
      if (id !== generation || !shouldShow()) return;
      mounting = false;
      if (!ok) { createIframeFallback(id); return; }
      try {
        var p = new Twitch.Player(mount.id, {
          channel: channel, parent: [location.hostname],
          width: '100%', height: 300, autoplay: true, muted: true
        });
        player = p;
        p.addEventListener(Twitch.Player.READY, function () {
          if (id !== generation) return;
          p.setMuted(true);
          lowQuality(p, id);
          [250, 800, 2000, 5000].forEach(function (ms) {
            setTimeout(function () { lowQuality(p, id); }, ms);
          });
        });
        p.addEventListener(Twitch.Player.PLAYING, function () { lowQuality(p, id); });
        p.addEventListener(Twitch.Player.ONLINE, function () { lowQuality(p, id); });
      } catch (e) {
        console.warn('Twitch: API no disponible, usando modo compatible', e);
        player = null;
        createIframeFallback(id);
      }
    });
  }
  function loadConfig() {
    if (!desktop.matches || checkedConfig || loadingConfig) return;
    loadingConfig = true;
    fetch('./cine.json?t=' + Date.now(), { cache:'no-store' })
      .then(function (response) { if (!response.ok) throw new Error('Sin cine.json'); return response.json(); })
      .then(function (data) {
        var value = String((data && data.twitchChannel) || '').trim().toLowerCase();
        channel = /^[a-z0-9_]{3,25}$/.test(value) ? value : '';
        var pref = String((data && data.twitchPlayerQuality) || '160p').trim().toLowerCase();
        desired = pref === '240p' ? '240p' : '160p';
        checkedConfig = true;
        if (channel && link) link.href = 'https://www.twitch.tv/' + channel;
        sync();
      })
      .catch(function (error) { console.warn('Twitch PC: no se pudo leer la configuracion:', error); })
      .finally(function () { loadingConfig = false; });
  }
  function update() { sync(); loadConfig(); }
  var observer = new MutationObserver(function (changes) {
    if (changes.some(function (change) { return change.attributeName === 'class'; })) sync();
  });
  observer.observe(document.body, { attributes:true, attributeFilter:['class'] });
  if (desktop.addEventListener) desktop.addEventListener('change', update);
  else if (desktop.addListener) desktop.addListener(update);
  update();
})();
</script>


<script>
/* ALECCISS_FOOTER_TABS_V6: reubica los tabs existentes sin duplicarlos ni reiniciar chats. */
(function() {
  const bar = document.querySelector('#chatSidebar > .chat-header');
  const sidebar = document.getElementById('chatSidebar');
  const footer = document.querySelector('.footer');
  if (!bar || !sidebar || !footer) return;
  const anchor = document.createComment('Posicion original de los chats en movil');
  sidebar.insertBefore(anchor, bar);
  function reposition() {
    if (window.innerWidth >= 1100) {
      if (bar.parentElement !== footer) footer.appendChild(bar);
    } else if (bar.parentElement !== sidebar) {
      sidebar.insertBefore(bar, anchor.nextSibling);
    }
  }
  reposition();
  window.addEventListener('resize', reposition, { passive: true });
})();
</script>
